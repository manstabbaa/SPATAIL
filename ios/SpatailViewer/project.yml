name: SpatailViewer
options:
  bundleIdPrefix: dev.spatail
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone, iPad

targets:
  SpatailViewer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Reuse the brain's contract types verbatim (Foundation-only, no deps).
      - path: ../Spatail/Sources/ModularContract.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SPATAIL Viewer
        UILaunchScreen: {}
        # AR placement + live object recognition both use the camera.
        NSCameraUsageDescription: "SPATAIL uses the camera for AR placement and live object recognition."
        # The viewer talks cleartext HTTP to the PC brain + detector over Tailscale/LAN.
        # iOS ATS blocks cleartext by default, so allow it (dev setting; tighten for prod).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spatail.viewer
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
